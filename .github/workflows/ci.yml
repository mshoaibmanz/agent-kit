name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  tests:
    # The hooks target macOS (bash 3.2, afplay, the Keychain); test them there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setup_test's upgrade cases install the base release from history first
      # ro-mysql needs 3.10+; the runner's /usr/bin/python3 may be older.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # team_pack_test syncs and starts a pack's MCP server project with uv.
      - name: Install uv
        run: python -m pip install uv==0.11.6
      - name: Install gitleaks (pinned, checksum-verified) for the pre-push hook tests
        env:
          SHA256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
        working-directory: ${{ runner.temp }}
        run: |
          V=$GITLEAKS_VERSION
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_darwin_arm64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | shasum -a 256 -c -
          tar -xzf gitleaks.tgz gitleaks
          echo "GITLEAKS=$PWD/gitleaks" >> "$GITHUB_ENV"
      # Concurrent, one suite per CPU, each in its own HOME and TMPDIR; a failure prints its log tail.
      - name: Hook suites, plugin manifests and copies
        env:
          TMPDIR: ${{ github.workspace }}/../agent-kit-test-fixtures
        run: bash tests/run-tests.sh

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the scan reads every commit
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        # Outside the checkout: the scan reads untracked files too.
        working-directory: ${{ runner.temp }}
        run: |
          V=$GITLEAKS_VERSION
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          echo "GITLEAKS=$PWD/gitleaks" >> "$GITHUB_ENV"
      - name: Leak scan (tree, history, org denylist, identities, images)
        env:
          TMPDIR: ${{ github.workspace }}/../agent-kit-test-fixtures
          # The org denylist, one term per line (sources and format: scripts/leak-check.sh). A plain
          # term of 6 characters or fewer matches only at a word start; longer ones anywhere; other
          # lines are EREs. A hit prints only line numbers, so the list never reaches these logs.
          LEAK_TERMS: ${{ secrets.LEAK_TERMS }}
          # Fork PRs get no secrets and skip the list with a warning; on a push or a same-repo PR a
          # missing list is a failure, not a pass.
          REQUIRE_LEAK_TERMS: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        # .scan-history-allow is read from a commit this run did not add, never from the checkout: the
        # PR's base, the main a push to main replaces, or where a pushed branch left main.
        run: |
          mkdir -p "$TMPDIR"
          case "$EVENT:$GITHUB_REF" in
            pull_request:*) base=$PR_BASE ;;
            push:refs/heads/main) base=$BEFORE ;;
            *) base=$(git merge-base HEAD refs/remotes/origin/main || true) ;;
          esac
          bash scripts/scan.sh --allow-base "$base"
