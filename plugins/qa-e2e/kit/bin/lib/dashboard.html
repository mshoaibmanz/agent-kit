<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${style_hash}; script-src ${script_hash}">
<title>agent-kit setup</title>
<style>
:root{color-scheme:light;--line:#dde1e6;--ink:#1d232b;--soft:#5b6570;--link:#24527a;--bg:#f5f6f8}
*{box-sizing:border-box}
html{scroll-padding-top:16px}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.side{position:fixed;top:0;left:0;bottom:0;width:240px;overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:18px 14px}
.side .kit{font-weight:650;font-size:16px;word-break:break-all}
.side .gen{font-size:12px;color:var(--soft);margin:2px 0 12px}
#q{width:100%;font-size:14px;padding:6px 9px;border:1px solid #cfd6de;border-radius:6px;margin-bottom:12px}
.side nav a{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px}
.side nav a:hover{background:#f0f3f6}
.side nav a.on{background:#e7eef6;color:var(--link);font-weight:600}
.side nav a:first-child{margin-bottom:6px;border:1px solid var(--line)}
.side nav .t{flex:1}
.side nav .n{font-size:12px;color:var(--soft);min-width:1.5em;text-align:right}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.warn{background:#d9a21b}.dot.bad{background:#c43c3c}
main{margin-left:240px;padding:24px 32px 64px;min-width:0}
.intro{font-size:13px;color:var(--soft);margin-bottom:18px}
.intro .path{margin-right:2px}
body.views main section.card{display:none}
body.views main section.card.cur{display:block}
.desc{font-size:12px;color:var(--soft);font-weight:400}
tr.hit td,h3.hit{background:#fff1bf}
td{transition:background .4s}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 20px 18px;margin-bottom:28px}
.card .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 0 12px;margin-bottom:12px;border-bottom:1px solid #eceff2}
.card h2{margin:0;font-size:19px}
.card .sum{font-size:13px;color:var(--soft);margin-top:2px}
.card .src{font-size:12px;text-align:right;max-width:50%}
.attention.warn{border-color:#e8c766;background:#fffaf0}
.attention ul{margin:0;padding-left:20px}.attention li{margin:6px 0}
.attention li>a{color:var(--ink);text-decoration:none;border-bottom:1px dotted #9aa4ae}.attention li>a:hover{color:var(--link);border-bottom-color:var(--link)}
h3{font-size:15px;margin:20px 0 8px}
.alert{background:#fdeeee;color:#9b2323;border-radius:6px;padding:6px 10px}
.tw{overflow-x:auto;border:1px solid #eceff2;border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th,td{text-align:left;vertical-align:top;padding:7px 9px;border-bottom:1px solid #eceff2}
tbody tr:last-child td{border-bottom:0}
th{background:#f4f6f8;font-weight:600;white-space:nowrap}
code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:#f2f4f6;border-radius:4px;padding:1px 4px;word-break:break-all}
code.p{display:inline-block;max-width:32em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;word-break:normal;vertical-align:bottom}
pre{font:12px/1.4 ui-monospace,Menlo,monospace;background:#f2f4f6;padding:8px;border-radius:6px;overflow:auto}
.path{display:inline-flex;gap:4px;align-items:center;margin:1px 6px 1px 0;max-width:100%}.path a{font-size:12px;color:var(--link)}
.cmd{display:flex;gap:6px;align-items:flex-start;margin:3px 0}
button.cp{font-size:11px;border:1px solid #cfd6de;background:#fff;border-radius:4px;padding:1px 6px;cursor:pointer;color:var(--link);flex:none}
button.cp.done{background:#e3f4e8;border-color:#7cc49a}
.b{display:inline-block;font-size:11px;border-radius:10px;padding:1px 8px;margin:1px 3px 1px 0;background:#eef1f4;color:#3b4550;white-space:nowrap}
.b.ok{background:#e3f4e8;color:#1d6b3b}.b.bad{background:#fbe6e6;color:#9b2323}.b.warn{background:#fff3d6;color:#7a5600}
.b.off{background:#f3f4f6;color:#8a939c;text-decoration:line-through}
.ah{border:1px solid #eceff2;border-radius:8px;padding:4px 14px 12px;margin-top:20px}
.ah label{display:flex;flex-direction:column;font-size:12px;color:var(--soft);gap:2px}
.ah input[type=text]{font:13px ui-monospace,Menlo,monospace;padding:5px 7px;border:1px solid #cfd6de;border-radius:5px;color:var(--ink)}
.ah .wide{margin:8px 0}.ahf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.ah label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px}
.ah pre{margin:0;flex:1}
.muted{color:#7b858f}details summary{cursor:pointer;color:var(--link)}details[open]>summary{margin-bottom:4px}
@media (max-width:900px){
.side{position:static;width:auto;border-right:0;border-bottom:1px solid var(--line)}
.side nav{display:flex;flex-wrap:wrap;gap:4px}.side nav a:first-child{margin-bottom:0}
main{margin-left:0;padding:18px}
.card .head{flex-direction:column}.card .src{text-align:left;max-width:100%}
}
</style>
</head>
<body>
<aside class="side">
<div class="kit">${kit_name}</div>
<div class="gen">Generated ${generated}</div>
<input id="q" type="search" placeholder="Filter rows">
<nav>${nav}</nav>
</aside>
<main>
<div class="intro">The kit at ${kit} read by the engine at ${engine}. Read-only: copy a command to change anything.</div>
${attention}
${sections}
</main>
<script>
document.addEventListener('click',function(e){var b=e.target.closest('button.cp');if(!b)return;
var t=b.getAttribute('data-c');var done=function(){b.classList.add('done');b.textContent='copied';
setTimeout(function(){b.classList.remove('done');b.textContent='copy'},1200)};
if(navigator.clipboard){navigator.clipboard.writeText(t).then(done,function(){fallback(t);done()})}else{fallback(t);done()}});
function fallback(t){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();
try{document.execCommand('copy')}catch(x){}document.body.removeChild(a)}
(function(){
var q=document.getElementById('q'),cards=[].slice.call(document.querySelectorAll('main section.card')),links={};
document.querySelectorAll('.side nav a').forEach(function(a){links[a.getAttribute('data-k')]=a});
function filter(){var cur=document.querySelector('main section.card.cur'),t=q.value.toLowerCase();if(!cur)return;
cur.querySelectorAll('tbody tr, .attention li').forEach(function(r){r.style.display=!t||r.textContent.toLowerCase().indexOf(t)>=0?'':'none'})}
function show(){var id=decodeURIComponent(location.hash.slice(1)),el=id?document.getElementById(id):null;
var card=el?el.closest('main section.card'):null;if(!card)card=document.getElementById('attention');
cards.forEach(function(c){c.classList.toggle('cur',c===card)});
Object.keys(links).forEach(function(k){links[k].classList.toggle('on',k===card.id)});filter();
if(el&&el!==card){var d=el.closest('details');if(d)d.open=true;el.scrollIntoView({block:'center'});el.classList.add('hit');
setTimeout(function(){el.classList.remove('hit')},1800)}else{window.scrollTo(0,0)}}
document.body.classList.add('views');q.addEventListener('input',filter);window.addEventListener('hashchange',show);show()})();
/*ah:begin*/
var AH_SECRET=/pass|pwd|secret|token/i,AH_LOOKS_SECRET=/:[^\/@]*@|pass|pwd|secret|token/i;
function ahDec(s){try{return decodeURIComponent(s)}catch(x){return s}}
function ahRules(get){var re=function(k){return new RegExp('^(?:'+get(k)+')$$')},range=function(k){return get(k).split('-').map(Number)};
return{name:re('name'),user:re('user'),via:re('via'),host:re('host'),port:/^[0-9]{1,5}$$/,local:/^[0-9]+$$/,
localPorts:range('local-ports'),remotePorts:range('remote-ports'),staging:new RegExp(get('staging'),'i'),
prefix:get('prefix'),suffix:get('suffix'),service:get('service')}}
function ahScrub(text){var s=text.trim(),i=s.indexOf('://'),secret=false;if(i<0)return{text:s,secret:false};
var head=s.slice(0,i+3),rest=s.slice(i+3),at=-1,u,c;
for(var j=rest.length-1;j>=0&&at<0;j--){if(rest.charAt(j)!=='@')continue;u=rest.slice(0,j);c=u.indexOf(':');if(!/[\/?#]/.test(c<0?u:u.slice(0,c)))at=j}
if(at>=0){u=rest.slice(0,at);c=u.indexOf(':');if(c>=0){secret=true;u=u.slice(0,c)}rest=(u?u+'@':'')+rest.slice(at+1)}
var q=rest.indexOf('?');if(q>=0){var h=rest.indexOf('#',q),end=h<0?rest.length:h,kept=[];
rest.slice(q+1,end).split('&').forEach(function(kv){if(!kv)return;if(AH_SECRET.test(ahDec(kv.split('=')[0])))secret=true;else kept.push(kv)});
rest=rest.slice(0,q)+(kept.length?'?'+kept.join('&'):'')+rest.slice(end)}
return{text:head+rest,secret:secret}}
function ahParse(uri){var m=/^mysql:\/\/(?:([^:@\/?#]+)@)?([^:@\/?#]+)(?::([0-9]+))?(?:\/([^?#]*))?(?:\?([^#]*))?$$/i.exec(uri.trim());
if(!m)return{error:'Not a mysql:// connection URI.'};
var f={user:ahDec(m[1]||''),host:m[2],port:m[3]||'3306',name:ahDec(m[4]||'')};
(m[5]||'').split('&').forEach(function(kv){if(!kv)return;var i=kv.indexOf('='),k=ahDec(i<0?kv:kv.slice(0,i)),v=ahDec(i<0?'':kv.slice(i+1));
if(k==='via')f.via=v;else if(k==='local_port')f.local=v;else if(k==='name')f.name=v;else if(k==='staging')f.staging=v===''||v==='1'||v==='true'});
return{fields:f}}
function ahRead(text){var s=ahScrub(text),notes=[],p=ahParse(s.text);
if(s.secret)notes.push('A password in the URI was removed and is not shown: ro-mysql add asks for it.');
if(!p.error)return{value:s.text,fields:p.fields,notes:notes};
if(AH_LOOKS_SECRET.test(s.text))return{value:'',notes:notes.concat(['The URI could not be read and looked like it held a password, so it was cleared: fill the fields instead.',p.error])};
return{value:s.text,notes:notes.concat([p.error])}}
function ahBuild(f,known,r){var w=[],bad=[],raw=f.name||'',name=raw.indexOf(r.prefix)===0?raw.slice(r.prefix.length):raw;
['name','user','via','host','port','local'].forEach(function(k){if(!r[k].test(k==='name'?raw:(f[k]||'')))bad.push(k)});
var local=parseInt(f.local,10),port=parseInt(f.port,10);
if(bad.indexOf('local')<0&&(local<r.localPorts[0]||local>r.localPorts[1]))bad.push('local');
if(bad.indexOf('port')<0&&(port<r.remotePorts[0]||port>r.remotePorts[1]))bad.push('port');
if(f.via&&f.via.toLowerCase().indexOf(r.prefix)===0)bad.push('via');
var alias=r.prefix+(f.staging&&!r.staging.test(name)?name+r.suffix:name);
if(!f.staging&&r.staging.test(alias)){w.push('The name reads as STAGING: tick Staging, or pick another name.');if(bad.indexOf('name')<0)bad.push('name')}
if(known.ports.indexOf(String(local))>=0)w.push('Local port '+local+' is already forwarded by a known tunnel: pick another.');
if(name&&known.aliases.indexOf(alias)>=0)w.push(alias+' already exists.');
if(bad.length)return{cmd:'',manual:'',alias:'',warnings:w,missing:bad};
var cmd='ro-mysql add --name '+name+' --user '+f.user+' --via '+f.via+' --remote '+f.host+':'+f.port+' --local-port '+local+(f.staging?' --staging':'');
var manual=['# 1. Print the ssh block, checked with ssh -G, and where it goes in ~/.ssh/config:',cmd+' --dry-run',
'# 2. Paste it there, then store the password (security prompts for it):','security add-generic-password -U -s '+r.service+' -a '+f.user+'@'+alias+' -w',
'# 3. Check it:','ro-mysql --tunnels --refresh'].join('\n');
return{cmd:cmd,manual:manual,alias:alias,warnings:w,missing:[]}}
/*ah:end*/
(function(){var box=document.getElementById('sql-add');if(!box)return;
var list=function(a){return(box.getAttribute(a)||'').split(' ').filter(Boolean)},known={ports:list('data-ports'),aliases:list('data-aliases')};
var rules=ahRules(function(k){return box.getAttribute('data-p-'+k)||''});
var uri=document.getElementById('ah-uri'),warn=document.getElementById('ah-warn'),cmd=document.getElementById('ah-cmd'),man=document.getElementById('ah-manual');
var cmdCp=document.getElementById('ah-cmd-cp'),manCp=document.getElementById('ah-man-cp'),inputs={};
uri.placeholder='mysql://'+'reader@orders-db:3306/orders?via=jump&local_port=15310&staging=1';
box.querySelectorAll('[data-f]').forEach(function(i){inputs[i.getAttribute('data-f')]=i});
function fields(){var f={};Object.keys(inputs).forEach(function(k){f[k]=inputs[k].type==='checkbox'?inputs[k].checked:inputs[k].value.trim()});return f}
function update(notes){var r=ahBuild(fields(),known,rules),w=(notes||[]).concat(r.warnings);warn.hidden=!w.length;warn.textContent=w.join(' ');
cmd.textContent=r.cmd||'Still needed: '+r.missing.join(', ');cmdCp.setAttribute('data-c',r.cmd);cmdCp.disabled=!r.cmd;
man.textContent=r.manual;manCp.setAttribute('data-c',r.manual);manCp.disabled=!r.manual}
uri.addEventListener('input',function(){if(!uri.value.trim()){update();return}var r=ahRead(uri.value);
if(r.value!==uri.value.trim())uri.value=r.value;
Object.keys(r.fields||{}).forEach(function(k){var i=inputs[k];if(!i)return;if(i.type==='checkbox')i.checked=!!r.fields[k];else i.value=r.fields[k]});update(r.notes)});
Object.keys(inputs).forEach(function(k){inputs[k].addEventListener('input',function(){update()})});update()})();
</script>
</body>
</html>
