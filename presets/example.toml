# agent-kit team preset: non-secret defaults a team shares, so a teammate runs one command:
#   agent-setup --preset gh:example-org/agent-kit-preset --apply
# Keep the real preset in a private repository of your organization (agent-setup fetches the
# repository at its head commit with each user's own gh login), never in the public kit. That
# repository is a team pack: beside agent-kit-preset.toml it may hold skills/<name>/SKILL.md and a
# rules.md of at most 300 words (README "Team packs").
# Your own answers (flags, an earlier install's choices, the guided prompts) and your own
# local/kit.env win over every value here; a changed preset applies on the next run.
# Secrets never go here: setup refuses token formats (ghp_, sk-, xox*-, AKIA and the like) and
# credentials in URLs.

# [kit]: overlay keys, the names and meanings in hooks/lib/README. They land in local/preset.env.
[kit]
CODE_SEARCH_GH_OWNER = "example-org"              # code-search's default org; setup checks you are a member
CODE_DIRS_JSON = ["~/Code"]                       # parent folders of local clones
CODE_SEARCH_ZOEKT_URL = "https://zoekt.example.com"  # optional Zoekt backend, used when gh cannot read a repo
REVIEW_BASE = "main"                              # the branch review rounds diff against
RELEASE_BRANCH_RE = "^release/"                   # branches the push gate treats as releases
BQRO_PROJECT = "example-project"                  # bqro's jobs project
# GIT_AUTHOR = "Example Bot <bot@example.com>"    # only when the team commits under one author
# SUBAGENT_RESUME_MAX = "300000"                  # context tokens past which a subagent is not resumed
# TICKET_PREFIXES = "ABC,OPS"                     # optional: the only Jira project keys that name tickets

# Claude Code plugins setup enables (settings.json enabledPlugins). source, when given, adds the
# marketplace as a GitHub repository; leave it out for a marketplace each user adds themselves.
[plugins.codex]
marketplace = "openai-codex"
source = "github:openai/codex-plugin-cc"

# MCP servers: a command (often a credential wrapper the kit ships, such as sentry-mcp, which reads
# the Keychain or secret-tool at start) or a URL with native OAuth. No env, headers or inline keys.
# A command or arg names the kit as {{KIT_DIR}}: setup fills each user's own kit root, since hosts
# expand neither ~ nor variables in an MCP command. Options go in args, as the preset has no env.
[mcp.servers.docs]
url = "https://mcp.example.com/mcp"

# A server run from each user's local clone: {{CODE_DIR}} is their first repository root
# (CODE_DIRS_JSON); setup leaves the server out until that clone has the command.
# [mcp.servers.tools]
# command = "{{CODE_DIR}}/tools-mcp/.venv/bin/tools-mcp"

# A server the team pack bundles: its mcp/ folder is a uv project (pyproject.toml and uv.lock).
# {{PACK_DIR}} is the pack's copy in each user's kit. Setup runs `uv sync --frozen --no-dev` on it,
# writes uv's absolute path as the command (an app started from the Dock has no ~/.local/bin on its
# PATH), and leaves the server out, listed under Skipped, while uv is missing.
# [mcp.servers.pack-tools]
# command = "uv"
# args = ["run", "--project", "{{PACK_DIR}}/mcp", "--frozen", "--no-dev", "team-tools-mcp"]

# [mcp.servers.sentry]
# command = "{{KIT_DIR}}/bin/sentry-mcp"
# args = ["--host=sentry.example.com", "--disable-skills=seer"]

# Sentry instances (mcp/sentry-instances.json): each has a host and the Keychain or secret-tool
# service its token lives in (never the token). The one whose server is "sentry" is the entry above;
# each other renders as its own server (default sentry-<name>) once that user has its token.
# bin/sentry-map finds which instance, org and project a service reports to.
# [sentry.instances.main]
# host = "sentry.example.com"
# keychain = "agent-kit/mcp/sentry"
# server = "sentry"
# orgs = { example = "prod", example-alt = "staging" }   # only for slugs that say neither prd nor stg
# [sentry.instances.saas]
# host = "sentry.io"
# keychain = "agent-kit/mcp/sentry-saas"

[hosts]
recommended = ["claude", "codex"]                 # shown when none is detected; detection wins

[roles.cross-reviewer]                            # model and effort overrides per role (roles.toml names)
effort = "high"

[skills]
exclude = ["process-doc"]                         # or include = [...] for an allowlist
